# MYRAG —— 全栈（生产环境）
# 用法：cp .env.example .env && docker compose up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: myrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myrag
    ports:
      - "5433:5432"
    volumes:
      - myrag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: myrag-chromadb
    ports:
      - "8002:8000"
    volumes:
      - myrag_chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: myrag-backend
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file: .env
    environment:
      # 覆盖为 Docker 内部网络配置
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/myrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    volumes:
      - myrag_uploads:/app/backend/uploads
      - myrag_data:/app/backend/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Linux 下需要此配置，使宿主机上的 Ollama 可通过 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: myrag-mcp-server
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8080/api/v1
      TRANSPORT: http
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: myrag-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"
    restart: unless-stopped

volumes:
  myrag_postgres_data:
  myrag_chroma_data:
  myrag_uploads:
  myrag_data:
